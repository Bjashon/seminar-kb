<title>@@TITLE@@</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=PT+Mono&family=PT+Sans:ital,wght@0,400;0,700;1,400&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
/* Layout: тетрадь в клетку (в тёмной теме — школьная доска); слева закладка-оглавление,
   справа одна колонка лекции, реплики диалога отделены красным полем, как в тетради. */
:root {
  --paper: #fbfcfe;
  --grid: rgba(58, 104, 168, 0.075);
  --ink: #1b2130;
  --ink-soft: #566074;
  --rule: #d5dbe6;
  --card: #ffffff;
  --card-2: #f3f5f9;
  --accent: #2346b4;
  --accent-ink: #ffffff;
  --margin: #d4544f;
  --good: #1c7a49;
  --bad: #b3303a;
  --even: #2458c9;
  --odd: #b8630a;
  --marker: #fff1b8;
  --shadow: 0 1px 2px rgba(20, 30, 60, .06), 0 10px 26px -14px rgba(20, 30, 60, .28);

  --f-display: "Old Standard TT", "Times New Roman", Times, serif;
  --f-body: "PT Serif", Georgia, "Times New Roman", serif;
  --f-ui: "PT Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "PT Mono", ui-monospace, Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #17221e; --grid: rgba(214, 232, 220, 0.028); --ink: #e4ebe5; --ink-soft: #a3b1a8;
    --rule: #334239; --card: #1e2b26; --card-2: #22312b; --accent: #93b7ff; --accent-ink: #0e1916;
    --margin: #ff8f88; --good: #86d7a1; --bad: #ff8f88; --even: #93b7ff; --odd: #ffc56d;
    --marker: #3b3a20; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 26px -14px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #17221e; --grid: rgba(214, 232, 220, 0.028); --ink: #e4ebe5; --ink-soft: #a3b1a8;
  --rule: #334239; --card: #1e2b26; --card-2: #22312b; --accent: #93b7ff; --accent-ink: #0e1916;
  --margin: #ff8f88; --good: #86d7a1; --bad: #ff8f88; --even: #93b7ff; --odd: #ffc56d;
  --marker: #3b3a20; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 26px -14px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }
body {
  margin: 0;
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink);
  font: 17px/1.62 var(--f-body);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

.page { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 120px; }
.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 44px; align-items: start; }
.main { min-width: 0; max-width: 760px; width: 100%; }
.table-wrap, .lab, .box, .q, .card-q { max-width: 100%; }

/* ---------- title ---------- */
.hero { padding-block: 18px 30px; border-bottom: 1px solid var(--rule); margin-bottom: 34px; }
.eyebrow { font: 700 12.5px/1.3 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 10px; }
h1 { font: 400 clamp(34px, 5.2vw, 54px)/1.08 var(--f-display); margin: 0 0 14px; text-wrap: balance; letter-spacing: -.005em; }
h1 em { font-style: italic; }
.lede { font-size: 19px; max-width: 62ch; margin: 0 0 20px; color: var(--ink); }
.hero-row { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; }
.progress { display: flex; align-items: center; gap: 10px; font: 14px/1.2 var(--f-ui); color: var(--ink-soft); }
.progress-bar { width: 150px; height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden; }
.progress-bar span { display: block; height: 100%; width: 0; background: var(--good); transition: width .3s; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--accent); background: transparent; color: var(--accent);
  font: 700 14.5px/1 var(--f-ui); padding: 10px 16px; border-radius: 6px; text-decoration: none; }
.btn:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.btn.solid { background: var(--accent); color: var(--accent-ink); }
.btn.solid:hover { background: color-mix(in srgb, var(--accent) 85%, var(--ink)); }
.btn.small { font-size: 13px; padding: 7px 11px; }
.btn[disabled] { opacity: .45; cursor: default; }

.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px 22px; margin: 26px 0 0; padding: 0; list-style: none;
  font: 14.5px/1.45 var(--f-ui); color: var(--ink-soft); }
.legend b { color: var(--ink); }

/* ---------- table of contents ---------- */
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 18px); font: 14.5px/1.35 var(--f-ui); }
.toc-title { font: 700 12px/1 var(--f-ui); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-soft); margin: 4px 0 12px; }
.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.toc a { display: grid; grid-template-columns: 26px minmax(0, 1fr) 16px; gap: 6px; align-items: baseline; padding: 6px 8px; border-radius: 5px;
  color: var(--ink); text-decoration: none; }
.toc a:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.toc a.current { background: var(--card); box-shadow: inset 2px 0 0 var(--margin); }
.toc .n { color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.toc .ok { color: var(--good); font-weight: 700; visibility: hidden; }
.toc a.done .ok { visibility: visible; }
.toc-mobile { display: none; }

/* ---------- modules ---------- */
.module { padding-block: 10px 36px; border-bottom: 1px solid var(--rule); margin-bottom: 40px; scroll-margin-top: 16px; }
.mod-head .eyebrow { margin-bottom: 6px; }
h2 { font: 400 clamp(28px, 3.6vw, 36px)/1.15 var(--f-display); margin: 0 0 14px; text-wrap: balance; }
h3 { font: 700 21px/1.3 var(--f-body); margin: 34px 0 12px; text-wrap: balance; }
h4 { font: 700 13px/1.3 var(--f-ui); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-soft); margin: 22px 0 8px; }
p { margin: 0 0 14px; }
.goals { font: 15px/1.5 var(--f-ui); color: var(--ink-soft); background: var(--card-2); border-radius: 6px; padding: 12px 16px; margin: 0 0 22px; }
.goals b { color: var(--ink); }
.goals ul { margin: 6px 0 0; padding-left: 20px; }
ul, ol { padding-left: 24px; }
li { margin-bottom: 6px; }

/* dialogue, set like a play script with the notebook's red margin */
.dlg { display: grid; grid-template-columns: 92px minmax(0, 1fr); column-gap: 18px; margin: 18px 0 20px; position: relative; }
.dlg::before { content: ""; position: absolute; left: 100px; top: 2px; bottom: 2px; width: 1.5px; background: var(--margin); opacity: .55; }
.dlg > .who { font: 700 12.5px/1.9 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; text-align: right; color: var(--ink-soft); padding-top: 1px; }
.dlg > .who.you { color: var(--accent); }
.dlg > .line { margin-bottom: 14px; min-width: 0; }
.dlg > .line.you { font-style: italic; }
.dlg > .line > :last-child { margin-bottom: 0; }

/* boxed statements */
.box { background: var(--card); border: 1px solid var(--rule); border-radius: 4px; padding: 14px 18px 4px; margin: 18px 0 22px; box-shadow: var(--shadow); }
.box > .lbl { display: block; font: 700 12.5px/1.2 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 8px; }
.box.thm > .lbl { color: var(--accent); }
.box.warn > .lbl { color: var(--margin); }
.eqn-tag { float: right; font: 13px/2.4 var(--f-ui); color: var(--ink-soft); }

.think { margin: 16px 0 20px; border: 1px dashed color-mix(in srgb, var(--accent) 55%, var(--rule)); border-radius: 6px; background: color-mix(in srgb, var(--card) 70%, transparent); }
.think > summary { cursor: pointer; padding: 10px 14px; list-style: none; }
.think > summary::-webkit-details-marker { display: none; }
.think > summary::before { content: "Подумай"; font: 700 12px/1 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--accent);
  border: 1px solid currentColor; border-radius: 3px; padding: 3px 6px; margin-right: 10px; }
.think > summary .hint { font: 13px var(--f-ui); color: var(--ink-soft); margin-left: 6px; }
.think[open] > summary .hint { display: none; }
.think > .ans { padding: 2px 16px 4px; margin: 0 10px 10px; background: var(--marker); border-radius: 4px; }
.think > .ans > p:first-child { padding-top: 10px; }

.table-wrap { overflow-x: auto; margin: 16px 0 22px; }
table { border-collapse: collapse; width: 100%; font: 15px/1.4 var(--f-ui); }
th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--rule); }
th { font-weight: 700; color: var(--ink-soft); font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }
td.num { font-variant-numeric: tabular-nums; text-align: right; }

.ev { color: var(--even); }
.od { color: var(--odd); }
mjx-container { max-width: 100%; }
mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; padding-block: 2px; margin: 12px 0 !important; }
.mono { font-family: var(--f-mono); }
.tag { display: inline-block; font: 700 11.5px/1 var(--f-ui); letter-spacing: .05em; padding: 4px 6px; border-radius: 3px; background: var(--card-2); color: var(--ink-soft); vertical-align: 2px; }

/* ---------- lab (interactive tools) ---------- */
.lab { background: var(--card); border: 1.5px solid color-mix(in srgb, var(--accent) 45%, var(--rule)); border-radius: 8px; padding: 16px 18px 18px; margin: 22px 0 26px; box-shadow: var(--shadow); }
.lab > .lbl { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; margin-bottom: 10px; }
.lab > .lbl b { font: 700 12.5px/1 var(--f-ui); letter-spacing: .09em; text-transform: uppercase; color: var(--accent); }
.lab > .lbl span { font: 700 17px/1.3 var(--f-body); }
.lab .desc { font: 15px/1.5 var(--f-ui); color: var(--ink-soft); margin-bottom: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin: 8px 0; }
.field { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 8px; align-items: center; margin: 6px 0; }
.field label { font: 700 15px var(--f-ui); color: var(--ink-soft); text-align: right; }
.inp { width: 100%; min-width: 0; border: 1px solid var(--rule); background: var(--paper); border-radius: 5px; padding: 8px 10px; font: 16px/1.3 var(--f-mono); }
.inp:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.keys { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0 4px; }
.key { border: 1px solid var(--rule); background: var(--card-2); border-radius: 4px; padding: 5px 9px; font: 15px/1 var(--f-mono); min-width: 34px; }
.key:hover { border-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 7px 12px; font: 14px/1 var(--f-ui); color: var(--ink-soft); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
select.inp { font-family: var(--f-ui); font-size: 15px; width: auto; }
.out { margin-top: 12px; border-top: 1px dashed var(--rule); padding-top: 10px; min-height: 40px; overflow-x: auto; }
.q .fb, .card-q, .msg .body, .box { overflow-x: auto; }
.out .res { margin: 6px 0; }
.out .err { color: var(--bad); font: 15px var(--f-ui); }
.ok-mark { color: var(--good); font: 700 14px var(--f-ui); }
.bad-mark { color: var(--bad); font: 700 14px var(--f-ui); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 15px/1.2 var(--f-body); padding: 5px 8px; border-radius: 4px; background: var(--card-2); border: 1px solid var(--rule); white-space: nowrap; }
.chip.ev { border-color: color-mix(in srgb, var(--even) 55%, var(--rule)); }
.chip.od { border-color: color-mix(in srgb, var(--odd) 55%, var(--rule)); }
.chip.sq { border-style: dashed; }
.word sub { font-size: 70%; }
.deg-row { display: grid; grid-template-columns: 94px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--rule); }
.deg-row .d { font: 700 13.5px/1.35 var(--f-ui); color: var(--ink-soft); }
.small { font: 14px/1.45 var(--f-ui); color: var(--ink-soft); }
.stat { font: 14.5px/1.5 var(--f-ui); }
.stat b { font-variant-numeric: tabular-nums; }

/* ---------- quiz ---------- */
.quiz { margin: 26px 0 8px; }
.quiz > h4 { color: var(--accent); }
.q { background: var(--card); border: 1px solid var(--rule); border-radius: 6px; padding: 12px 16px; margin: 10px 0; }
.q .qt { margin-bottom: 8px; }
.q .opts { display: grid; gap: 6px; }
.q .opt { text-align: left; border: 1px solid var(--rule); background: var(--paper); border-radius: 5px; padding: 8px 12px; font: 16px/1.4 var(--f-body); }
.q .opt:hover:not([disabled]) { border-color: var(--accent); }
.q .opt.right { border-color: var(--good); box-shadow: inset 3px 0 0 var(--good); }
.q .opt.wrong { border-color: var(--bad); box-shadow: inset 3px 0 0 var(--bad); }
.q .fb { margin-top: 8px; font: 15px/1.5 var(--f-ui); }
.q .fb b.r { color: var(--good); } .q .fb b.w { color: var(--bad); }
.quiz-score { font: 14px var(--f-ui); color: var(--ink-soft); }

.done-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-top: 26px; }
.done-btn[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: var(--accent-ink); }

/* ---------- proof map ---------- */
.map { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 22px; margin: 18px 0 24px; }
.map .col { display: grid; gap: 8px; align-content: start; }
.map .col-title { font: 700 12px/1.2 var(--f-ui); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-soft); text-align: center; }
.node { display: block; background: var(--card); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 12px; text-decoration: none; color: var(--ink); font: 14.5px/1.35 var(--f-ui); }
.node b { display: block; color: var(--accent); font-size: 13px; letter-spacing: .03em; }
.node:hover { border-color: var(--accent); }
.arrow { text-align: center; color: var(--ink-soft); font: 18px/1 var(--f-ui); }
.map .join { grid-column: 1 / -1; display: grid; gap: 8px; justify-items: center; }
.map .join .node { max-width: 420px; width: 100%; border-width: 1.5px; border-color: var(--accent); }
.map .leaves { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

/* ---------- flashcards ---------- */
.cards-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin: 12px 0; }
.card-q { background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 18px 20px; box-shadow: var(--shadow); min-height: 180px; }
.card-q .cq { font: 700 19px/1.45 var(--f-body); margin-bottom: 12px; }
.card-q .ca { border-top: 1px dashed var(--rule); padding-top: 12px; }
.card-list { columns: 2 280px; column-gap: 26px; font: 14.5px/1.45 var(--f-ui); margin-top: 16px; }
.card-list button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 4px 0; color: var(--ink); break-inside: avoid; }
.card-list button:hover { color: var(--accent); }
.card-list .st { display: inline-block; width: 16px; font-weight: 700; }
.card-list .st.know { color: var(--good); } .card-list .st.again { color: var(--odd); }

/* ---------- ask the lecturer ---------- */
.ask-fab { position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 40; box-shadow: var(--shadow);
  border-radius: 999px; padding: 13px 20px; font-size: 15px; }
:root { --drawer-w: clamp(460px, 50vw, 960px); }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(var(--drawer-w), 100vw); z-index: 50; background: var(--card); border-left: 1px solid var(--rule);
  box-shadow: -18px 0 40px -24px rgba(0, 0, 0, .45); display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.drawer-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 14px 16px 10px; border-bottom: 1px solid var(--rule); }
.drawer-head .t { font: 400 22px/1.2 var(--f-display); }
.x { border: 0; background: none; font: 26px/1 var(--f-ui); color: var(--ink-soft); padding: 2px 8px; }
.x:hover { color: var(--ink); }
.drawer-note { font: 13.5px/1.45 var(--f-ui); color: var(--ink-soft); padding: 8px 16px 0; }
.msgs { flex: 1; overflow-y: auto; padding: 12px 16px; display: grid; gap: 12px; align-content: start; }
.msg { font-size: 16px; line-height: 1.55; min-width: 0; }
.msg .w { display: block; font: 700 11.5px/1.4 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 2px; }
.msg.me .w { color: var(--accent); }
.msg.me .body { font-style: italic; }
.msg .body p { margin: 0 0 10px; }
.msg .body p:last-child { margin-bottom: 0; }
.msg .body ul, .msg .body ol { margin: 0 0 10px; padding-left: 20px; }
.msg .body code { font-family: var(--f-mono); font-size: 14px; background: var(--card-2); padding: 1px 4px; border-radius: 3px; }
.msg.pending .body { color: var(--ink-soft); }
.suggest { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 8px; }
.suggest button { border: 1px solid var(--rule); background: var(--paper); border-radius: 999px; padding: 6px 11px; font: 13.5px/1.2 var(--f-ui); color: var(--ink); text-align: left; }
.suggest button:hover { border-color: var(--accent); }
.composer { border-top: 1px solid var(--rule); padding: 10px 16px 14px; display: grid; gap: 8px; }
.composer textarea { width: 100%; min-height: 72px; max-height: 40vh; resize: vertical; border: 1px solid var(--rule); background: var(--paper); border-radius: 6px; padding: 9px 11px; font: 16px/1.45 var(--f-body); }
.composer textarea:focus { border-color: var(--accent); outline: none; }
.composer .row { justify-content: space-between; margin: 0; }
.chat-err { color: var(--bad); font: 14px var(--f-ui); }
/* The panel's left edge is a handle: drag it to make the panel wider or narrower. */
.drawer-grip { position: absolute; left: -6px; top: 0; bottom: 0; width: 12px; cursor: ew-resize; touch-action: none; z-index: 2; }
.drawer-grip::after { content: ""; position: absolute; left: 4px; top: 50%; width: 4px; height: 56px; margin-top: -28px; border-radius: 2px;
  background: var(--rule); transition: background .15s; }
.drawer-grip:hover::after, body.drawer-resizing .drawer-grip::after { background: var(--accent); }
body.drawer-resizing { user-select: none; -webkit-user-select: none; cursor: ew-resize; }
body.pk-open { --drawer-w: 460px; }
/* On a wide screen the panel takes its own column: the lecture moves left instead of hiding
   under it (and goes to one column while the panel is open). */
@media (min-width: 900px) {
  body.drawer-open { padding-right: min(var(--drawer-w), 100vw); }
  body.drawer-open .ask-fab { display: none; }
}
@media (min-width: 900px) {
  body.drawer-open .layout { grid-template-columns: minmax(0, 1fr); gap: 0; }
  body.drawer-open .toc-side { display: none; }

(5) {a,bc} = {a,b}c + (-1)^{\|a\||b|} b{a,c} + (-1)^{\|a\|} D(a)bc.

Замечание 2: (1),(3),(4) <=> (\Pi V,{,}) — супералгебра Ли («нечётная супералгебра Ли»); свободная нечётная супералгебра Ли на X = свободная супералгебра Ли на X с обращёнными чётностями.
Замечание 3: (a) при a = 1: D(bc) = D(b)c + (-1)^{|b|} b D(c) - D(1)bc; D — нечётное дифференцирование <=> D(1) = {1,1} = 0; в общем случае дифференцирование — D - D(1)id. В обобщённых супералгебрах Пуассона (чётная скобка) {1,1} = 0 по кососимметричности; здесь \|1\| = 1 и (3) ничего не даёт. (b) (5) <=> d_a(b) = {a,b} + (-1)^{\|a\|} D(a) b = {a,b} - {a,1}b — супердифференцирование чётности \|a\|; d_a(1) = 0.
Пример 1: V = F1 ⊕ Fε, |ε| = 1, ε^2 = 0, {1,1} = ε, остальные скобки базисных элементов 0. Все аксиомы выполнены, D(1) = ε ≠ 0, D(ε) = 0, D(1·1) = ε ≠ 2ε.
Примеры с D ≠ 0 (CK10): PO(n,n+1) = F[[x_1..x_n]] ⊗ Λ(ξ_1..ξ_n, τ), {f,g}_K = {f,g}_H + (E-2)(f) ∂g/∂τ + (-1)^{|f|} ∂f/∂τ (E-2)(g), E = Σ(x_i ∂/∂x_i + ξ_i ∂/∂ξ_i), {f,g}_H = Σ(∂f/∂x_i ∂g/∂ξ_i + (-1)^{|f|} ∂f/∂ξ_i ∂g/∂x_i) — скобка Баттина; D = -2∂/∂τ, {1,1} = 0. PO(n,n) со скобкой Баттина — алгебра Герстенхабера (скобка Схоутена поливекторных полей). CK10: каждая простая линейно компактная нечётная обобщённая супералгебра Пуассона калибровочно эквивалентна PO(n,n) или PO(n,n+1). В CK10 в скобках сказано, что D — нечётное дифференцирование; это верно при {1,1} = 0, но из аксиом не следует (пример 1, следствие 13).

Раздел 3. X = {1, x_1, x_2, ...}, 1 < x_1 < x_2 < ..., 1 чётна, чётности x_i произвольны. D_X — свободная алгебра с двумя операциями, I — идеал, порождённый аксиомами; G = D_X/I — свободная унитальная обобщённая алгебра Герстенхабера (универсальное свойство).
Хорошие слова (базисные коммутаторы Холла): буквы X; w = {u,v} хорошее <=> u,v хорошие, u > v и, если u = {u_1,u_2}, то u_2 <= v. Порядок: по степени, при равной степени — лексикографически по парам компонент. Для хорошего w = {u,v}: w > u > v.
M = { u, {v,v} : u, v хорошие, |v| = 0 } (квадраты чётных слов); порядок продолжен (квадрат — как пара (v,v)); 1 — наименьший; e_1 = 1 < e_2 < ...
L — свободная нечётная супералгебра Ли на X (1 — обычная буква).
Лемма 4: M — базис L. (Через обращение чётности и теорему о базисе свободной супералгебры Ли: множество Холла + квадраты нечётных элементов; Штерн 1986, Бахтурин–Михалёв–Петроградский–Зайцев, Бокуть–Канг–Ли–Малкольмсон. В TeX есть заметка авторам: проверить, что ссылки покрывают базисные коммутаторы Холла с этим порядком.)
U = { e_{i1}^{k1} ... e_{ir}^{kr} : r >= 0, 1 < i1 < ... < ir, k_j >= 1, k_j = 1 для нечётных e_{ij} } — суперкоммутативные одночлены от M \ {1}; deg_e(u) = Σ k_j.
Лемма 5: U порождает G. Гомоморфизм ψ: L -> G даёт {e,e'} ∈ span M для e,e' ∈ M. Индукция по N = deg_e(u) + deg_e(v): если deg_e(v) >= 2, v = v_1 v_2 и по (5) {u,v_1v_2} = {u,v_1}v_2 + (-1)^{\|u\||v_1|} v_1{u,v_2} + (-1)^{\|u\|}{1,u}v_1v_2 (у пар (u,v_1), (u,v_2), (1,u) сумма меньше N); если deg_e(v) <= 1 < deg_e(u) — кососимметричность. Индукция по числу букв некорректна: 1a = a уменьшает число букв, поправка в (5) увеличивает (пример: разложение {x_1, x_2x_3} содержит {1,x_1}x_2x_3). Этот пробел первой версии нашёл Aristotle (Harmonic), индукцию перевели на e-степень.

Раздел 4 (модель). L' = span(M \ {1}), S = S(L') — свободная суперкоммутативная супералгебра (базис U), \hat L = F1 ⊕ L' ≅ L (буква 1 <-> единица S); скобка L переносится на \hat L; D(u) = {1,u}; D(1) = {1,1} — нечётный элемент M \ {1}.
Для a = a_1...a_m (a_i ∈ \hat L): a_{<i} = a_1...a_{i-1}, a_{>i} = a_{i+1}...a_m, a_{\hat i} = a_{<i} a_{>i}.
(7) D(a) = Σ_i (-1)^{|a_{<i}|} a_{<i} {1,a_i} a_{>i} - (m-1){1,1} a.
(8) {a,b}^* = Σ_{i,j} (-1)^{|a_i||a_{>i}| + |b_j||b_{<j}|} a_{\hat i} {a_i,b_j} b_{\hat j} - (m-1) a D(b) + (n-1)(-1)^{\|a\|} D(a) b - (m-1)(n-1) a D(1) b.
Смысл: двойная сумма — «каждый множитель с каждым» (как для бидифференцирования); (n-1)(-1)^{\|a\|}D(a)b — n-1 применений (5), каждое даёт -{a,1}b; -(m-1)aD(b) — то же по первому аргументу; -(m-1)(n-1)aD(1)b отсутствует у Кайгородова 2017, где D(1) = 0. Член -(m-1){1,1}a в (7) компенсирует вставку лишнего множителя 1. Скобка на S однозначно определяется значениями на \hat L и аксиомами (3), (5); (8) — её замкнутый вид.
Лемма 6: правые части (7), (8) не зависят от разложения на множители из \hat L (суперсимметричность; вычёркивание единиц); (i) на \hat L совпадают со скобкой L; (ii) {1,a}^* = D(a); (iii) D(bc) = D(b)c + (-1)^{|b|} bD(c) - D(1)bc; (iv) чётности.
Лемма 7: нечётная кососимметричность {,}^*. Лемма 8: правило (5) для {,}^*.
Лемма 9 (якобиатор): если выполнены (1),(2),(3),(5) (без Якоби), то J(a,b,c) = {a,{b,c}} - {{a,b},c} - (-1)^{\|a\|\|b\|}{b,{a,c}} удовлетворяет (i) J(a,b,c) = -(-1)^{\|a\|\|b\|} J(b,a,c) = -(-1)^{\|b\|\|c\|} J(a,c,b); (ii) J(a,b,xy) = J(a,b,x)y + (-1)^{(|a|+|b|)|x|} x J(a,b,y) - J(a,b,1)xy. Доказательство: раскрыть три члена по (5); шестнадцать лишних членов сокращаются парами.
Предложение 10: Якоби на S: J = 0 на \hat L (Якоби в L) -> по (ii) и индукции по числу множителей для любого третьего аргумента -> по (i) для всех аргументов.
Теорема 11: (S, ·, {,}^*) — унитальная обобщённая алгебра Герстенхабера, порождённая X.
Теорема 12: U — базис G; φ: G -> S, тождественный на X, — изоморфизм (сюръекция по универсальному свойству, φ(u) = u, U — базис S, плюс лемма 5).
Следствие 13: {1,1} ≠ 0 в G; D не дифференцирование; {1,1}, {1,1}x_i, {1,x_i} линейно независимы ({1,x_i} = -(-1)^{\|x_i\|}{x_i,1}). Второе доказательство первой части: гомоморфизм G -> V из примера 1 (1 -> 1, x_i -> 0) переводит {1,1} в ε.
GenGer(n): для X = {1,x_1,...,x_n} — оболочка элементов U, мультилинейных по 1,x_1,...,x_n. Не однородная компонента: число вхождений 1 не градуировка (1a = a и поправка в (5)); мультистепень по x_i — градуировка, но компонента мультистепени (1,...,1) бесконечномерна.
Теорема 14: dim GenGer(n) = n·n!. Доказательство: мультилинейные элементы U <-> разбиения X на блоки без блока {1} + мультилинейное хорошее слово на каждом блоке ((k-1)! на блоке из k букв, число не зависит от чётностей; квадраты не мультилинейны); Σ_π Π_B (|B|-1)! = N! (перестановки = разбиения на циклы), откуда (n+1)! - n!.
Пример 2: GenGer(1) = <{x_1,1}>; GenGer(2): {x_1,1}x_2, {x_2,1}x_1, {{x_1,1},x_2}, {{x_2,1},x_1}; слово {{x_2,x_1},1} не хорошее.
Замечание 15: при D = 0 базис свободной алгебры Герстенхабера на x_1, x_2, ... — элементы U без буквы 1 (S от свободной нечётной супералгебры Ли); мультилинейная часть n!.

Контекст. Кайгородов 2017 (K17): свободные обобщённые супералгебры Пуассона (чётная скобка; {a,bc} = {a,b}c + (-1)^{|a||b|} b{a,c} - D(a)bc, D(a) = {a,1} — чётное дифференцирование): базис — одночлены от M \ {1}, M = хорошие слова + квадраты нечётных; dim GenP(n) = n·n!; супералгебры йордановых скобок (замена скобки {a,b}_D = {a,b} + (aD(b) - D(a)b)/2); аналог теоремы Фаркаша. Двойник Кантора K(A) = A ⊕ Ax, ax*bx = (-1)^{|b|}{a,b}; йордановы скобки — если K(A) йорданова (Кантор; Кинг–МакКриммон). Базисы свободных алгебр: алгебр Ли — Холл 1950, Ширшов; супералгебр Ли — Штерн 1986, БМПЗ, БКЛМ; супералгебр Пуассона — Шестаков 1993 (S от свободной супералгебры Ли). Алгебры Герстенхабера: когомологии Хохшильда (Герстенхабер 1963), поливекторные поля (скобка Схоутена), Λ(g), BV-алгебры (оператор Δ, Δ^2 = 0, {a,b} = (-1)^{|a|}(Δ(ab) - Δ(a)b - (-1)^{|a|} a Δ(b)); в PO(n,n) Δ = Σ ∂^2/∂x_i∂ξ_i), алгеброиды Ли (Сюй 1999).
Проверки (не часть доказательства): размерности компонент свободной алгебры при n <= 3 и всех чётностях совпали с |U|; формулы (7), (8) проверены символьно (39 200 тождеств); лемма 9 — для всех 16 расстановок чётностей.
Почему характеристика 0: теорема о базисе свободной супералгебры Ли (в хар. 3 [v,[v,v]] = 0 не следует из Якоби, в хар. 2 кососимметричность не даёт [a,a] = 0); a^2 = 0 для нечётного a.`;

const RULES_ASK = String.raw`Ты — лектор-алгебраист на консультации. Студентка 3 курса, алгебраист, соавтор статьи И. Кайгородова и К. Вяткиной «A basis of free generalized Gerstenhaber algebras», готовит по ней доклад. Многие понятия вокруг статьи (супералгебры, нечётные скобки, свободные алгебры, базис Холла, алгебры Пуассона и Герстенхабера и т. п.) она могла ещё не проходить. Ты объясняешь, а не перечисляешь.

// ---------- the calculators ----------
// Each one runs only when its block is in the text, wherever it stands. A block that is not
// there is skipped; one that is incomplete, or a calculator that fails, is reported inside its
// own block and does not stop the others.
function lab(id, needs, init) {
  const missing = needs.filter(s => !$(s));
  if (missing.length === needs.length) return;
  try {
    if (missing.length) throw new Error("в блоке нет " + missing.join(", "));
    init();
  } catch (e) {
    console.error("Вычислитель " + id + ":", e);
    const at = $("#" + id) || $(needs.find(s => $(s))).closest(".lab") || $(".main");
    const note = document.createElement("p");
    note.className = "err";
    note.textContent = "Вычислитель не запустился: " + (e && e.message ? e.message : String(e));
    if (at) at.appendChild(note);
  }
}

// ---------- lab: permutations and cycles ----------
lab("lab-dim", ["#dm-n", "#dm-out", "#dm-table"], function dimLab() {
  const seg = $("#dm-n"), out = $("#dm-out"), tbl = $("#dm-table");
  function perms(arr) { if (arr.length <= 1) return [arr]; const r = []; arr.forEach((x, i) => perms(arr.slice(0, i).concat(arr.slice(i + 1))).forEach(p => r.push([x].concat(p)))); return r; }
  function cycles(p) {
    const seen = new Set(), cs = [];
    for (let i = 0; i < p.length; i++) {
      if (seen.has(i)) continue;
      const c = []; let j = i;
      while (!seen.has(j)) { seen.add(j); c.push(j); j = p[j]; }
      cs.push(c);
    }
    return cs;
  }
  const cycHTML = c => "(" + c.map(letterHTML).join(" ") + ")";
  function render() {
    const n = +segValue(seg);
    const all = perms([...Array(n + 1).keys()]);
    const inc = [], exc = [];
    all.forEach(p => { const cs = cycles(p); (p[0] === 0 ? exc : inc).push(cs.map(cycHTML).join("")); });
    setMath(out, `<p class="stat">Перестановок $(n+1)!=${fact(n + 1)}$; с неподвижной $1$ — $n!=${fact(n)}$; остаётся <b>${inc.length}</b> $=n\\cdot n!$.</p>` +
      `<div class="deg-row"><div class="d">считаются</div><div class="chips">${inc.map(t => `<span class="chip word">${t}</span>`).join("")}</div></div>` +
      `<div class="deg-row"><div class="d">вычитаются: $1$ неподвижна</div><div class="chips">${exc.map(t => `<span class="chip word" style="opacity:.6">${t}</span>`).join("")}</div></div>`);
  }
  bindSeg(seg, render); render();
  let rows = "";
  for (let n = 1; n <= 7; n++) rows += `<tr><td class="num">${n}</td><td class="num">${fact(n + 1)}</td><td class="num">${fact(n)}</td><td class="num">${genGerCount(n)}</td><td class="num">${n * fact(n)}</td></tr>`;
  setMath(tbl, `<thead><tr><th>$n$</th><th>$(n+1)!$</th><th>$n!$</th><th>$\\sum_\\pi\\prod(|B|-1)!$</th><th>$n\\cdot n!$</th></tr></thead><tbody>${rows}</tbody>`);
});

// The block of the lecture at the top of the screen: the reading place to keep when the
// panel opens or closes (the text reflows) and the place to remember across devices.
const TOP = 90;
function readingPlace() {
  for (const m of MODULES) {
    if (m.el.getBoundingClientRect().bottom <= TOP) continue;
    const kids = m.el.children;
    for (let k = 0; k < kids.length; k++) {
      const r = kids[k].getBoundingClientRect();
      if (r.bottom > TOP) return { m: m.id, k, el: kids[k], top: r.top };
    }
    return { m: m.id, k: 0, el: m.el, top: m.el.getBoundingClientRect().top };
  }

}

function renderMD(text) {
  const math = [];
  let t = String(text).replace(/\$\$[\s\S]+?\$\$|\\\[[\s\S]+?\\\]|\$[^$\n]+?\$|\\\([\s\S]+?\\\)/g, m => { math.push(m); return "\u0000" + (math.length - 1) + "\u0000"; });
  t = esc(t);
  const inline = s => s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>").replace(/`([^`\n]+)`/g, "<code>$1</code>");
  const blocks = t.split(/\n{2,}/).map(b => {
    const lines = b.split("\n");
    if (lines.every(l => /^\s*[-*•]\s+/.test(l))) return "<ul>" + lines.map(l => "<li>" + inline(l.replace(/^\s*[-*•]\s+/, "")) + "</li>").join("") + "</ul>";
    if (lines.every(l => /^\s*\d+[.)]\s+/.test(l))) return "<ol>" + lines.map(l => "<li>" + inline(l.replace(/^\s*\d+[.)]\s+/, "")) + "</li>").join("") + "</ol>";
    if (/^#{1,4}\s/.test(lines[0])) return "<p><b>" + inline(lines[0].replace(/^#{1,4}\s/, "")) + "</b>" + (lines.length > 1 ? "<br>" + lines.slice(1).map(inline).join("<br>") : "") + "</p>";
    return "<p>" + lines.map(inline).join("<br>") + "</p>";
  });

}
